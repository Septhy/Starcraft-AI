name: Build recorder app

on:
  push:
    branches: [main]
    paths: ['recorder/**', 'tests/test_recorder.py', '.github/workflows/recorder.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -r recorder/requirements.txt pyinstaller pytest
      - name: Test
        run: python -m pytest -q tests/test_recorder.py
      - name: Build the app
        run: pyinstaller --onefile --windowed --name StarcraftRecorder recorder/recorder.py
      - name: Check the app starts
        shell: bash
        run: |
          ./dist/StarcraftRecorder.exe &
          sleep 15
          tasklist | grep -i StarcraftRecorder
          taskkill //F //IM StarcraftRecorder.exe
      - uses: actions/upload-artifact@v4
        with:
          name: StarcraftRecorder
          path: dist/StarcraftRecorder.exe
      - name: Publish the download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Takes screenshots while StarCraft runs. Built from commit $GITHUB_SHA."
          if gh release view recorder >/dev/null 2>&1; then
            gh release upload recorder dist/StarcraftRecorder.exe --clobber
            gh release edit recorder --notes "$notes"
          else
            gh release create recorder dist/StarcraftRecorder.exe --title "StarCraft recorder" --notes "$notes" --target "$GITHUB_SHA"
          fi
